# Walking-skeleton backend deploy (F-04).
#
# DEVIATION (conscious, MVP): this workflow auto-applies EF migrations to prod
# on merge to main, contradicting the documented "never auto-migrate prod /
# forward-only + human-gated" guardrail (infra-v2 Risk Register, roadmap F-04,
# lessons.md). Mitigations: migrate job runs only after a green build,
# applies an --idempotent script, and brackets the run with a transient
# per-runner-IP SQL firewall rule that is deleted in an always() step.
# Forward-only — rollback path is Azure SQL Basic Point-in-Time-Restore.

name: deploy-backend

on:
  push:
    branches: [main]
    paths:
      - 'src/server/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

# Serialize runs against this app+DB. cancel-in-progress:false because cancelling
# mid-migrate would strand the transient ci-<run-id> SQL firewall rule (cleanup
# runs only on natural job end via always()).
concurrency:
  group: deploy-backend-main
  cancel-in-progress: false

# id-token: write lets the migrate job's azure/login exchange the GitHub OIDC token for an
# Entra token (federated credential on app registration gh-prediction-league-sql in the SQL
# tenant, subject repo:Kumbus/Prediction-league:ref:refs/heads/main). The app deploys use
# publish profiles instead — see deploy-api.
permissions:
  id-token: write
  contents: read

# Apps live in subscription "Microsoft Azure Sponsorship", RG rg-dev-jwrona (moved 2026-09
# after the Visual Studio subscription was disabled). The SQL server lives in a separate,
# personally owned subscription (AZURE_SQL_RG) because Microsoft.Sql is not registered on
# Sponsorship and the RG-scoped Contributor there cannot register it.
env:
  DOTNET_VERSION: '10.0.x'
  AZURE_RG: rg-dev-jwrona
  AZURE_SQL_RG: rg-prediction-league
  AZURE_SQL_SERVER: sql-prediction-league-07cc57
  AZURE_SQL_HOST: sql-prediction-league-07cc57.database.windows.net
  AZURE_SQL_DB: appdb
  AZURE_SQL_USER: sqladmin
  AZURE_API_APP: prediction-league-api-07cc57
  AZURE_FUNC_APP: func-prediction-league-07cc57
  API_PROJECT: src/server/PredictionLeague.Api
  FUNC_PROJECT: src/server/PredictionLeague.Functions
  INFRA_PROJECT: src/server/PredictionLeague.Infrastructure

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/server/prediction-league.slnx

      # Red test blocks the deploy. This workflow only triggers on push to main, so
      # PRs stay ungated until the broader gate wiring lands.
      #
      # -c Release deliberately: it is the configuration that ships, and the publish
      # steps below reuse these intermediate outputs instead of rebuilding the tree.
      - name: Run tests
        run: dotnet test src/server/prediction-league.slnx -c Release --no-restore

      - name: Publish API
        run: dotnet publish ${{ env.API_PROJECT }} -c Release -o api-publish --no-restore

      - name: Publish Functions
        run: dotnet publish ${{ env.FUNC_PROJECT }} -c Release -o func-publish --no-restore

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      # AddInfrastructure throws if ConnectionStrings__DefaultConnection is absent
      # (DependencyInjection.cs:25-28) before EF reads the model. Script generation
      # only parses the string; it never connects.
      - name: Generate idempotent migration script
        env:
          ConnectionStrings__DefaultConnection: 'Server=_;Database=_;User Id=_;Password=_;TrustServerCertificate=True;'
        run: |
          dotnet ef migrations script --idempotent \
            --project ${{ env.INFRA_PROJECT }} \
            --startup-project ${{ env.API_PROJECT }} \
            -o migrate.sql

      - name: Upload API artifact
        uses: actions/upload-artifact@v6
        with:
          name: api-publish
          path: api-publish

      - name: Upload Functions artifact
        uses: actions/upload-artifact@v6
        with:
          name: func-publish
          path: func-publish
          # .azurefunctions/ is a hidden dir required by Flex Consumption packaging.
          # actions/upload-artifact@v4 excludes hidden by default.
          include-hidden-files: true

      - name: Upload migration script
        uses: actions/upload-artifact@v6
        with:
          name: migrate-sql
          path: migrate.sql

  migrate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download migration script
        uses: actions/download-artifact@v8
        with:
          name: migrate-sql

      # az sql firewall-rule needs a real principal in the SQL subscription, which sits
      # in a different tenant than the apps -> its own app registration (OIDC).
      - name: Azure login to SQL subscription (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_SQL_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_SQL_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SQL_SUBSCRIPTION_ID }}

      - name: Install sqlcmd
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> $GITHUB_PATH

      - name: Open SQL firewall for this runner
        id: openfw
        run: |
          IP=$(curl -s https://api.ipify.org)
          RULE="ci-${GITHUB_RUN_ID}"
          az sql server firewall-rule create \
            -g $AZURE_SQL_RG -s $AZURE_SQL_SERVER -n $RULE \
            --start-ip-address $IP --end-ip-address $IP
          echo "rule=$RULE" >> $GITHUB_OUTPUT

      - name: Apply migration (idempotent, forward-only)
        env:
          SQL_PASS: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          # -I sets QUOTED_IDENTIFIER ON — Azure SQL requires it for
          # filtered/computed-column indexes (Identity schema has them).
          sqlcmd -S $AZURE_SQL_HOST -d $AZURE_SQL_DB -U $AZURE_SQL_USER -P "$SQL_PASS" -i migrate.sql -b -N -C -I

      - name: Remove CI firewall rule
        if: always() && steps.openfw.outputs.rule != ''
        run: |
          az sql server firewall-rule delete \
            -g $AZURE_SQL_RG -s $AZURE_SQL_SERVER -n ${{ steps.openfw.outputs.rule }}

  deploy-api:
    needs: [build, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v8
        with:
          name: api-publish
          path: api-publish

      # Publish profile instead of Entra auth: the only role on the Sponsorship RG is the
      # developer's own Contributor, which cannot grant a role to a CI principal. Requires
      # SCM Basic Auth enabled on the app (+ WEBSITE_WEBDEPLOY_USE_SCM=true on Linux).
      # The startup command ("dotnet PredictionLeague.Api.dll") is set once on the app
      # itself — there is no Azure login here to re-pin it on every deploy.
      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_API_APP }}
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: api-publish

  deploy-func:
    needs: [build, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Functions artifact
        uses: actions/download-artifact@v8
        with:
          name: func-publish
          path: func-publish

      # Publish profile for the same reason as deploy-api; on Flex Consumption the
      # action needs sku: flexconsumption when authenticating this way.
      - name: Deploy Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNC_APP }}
          publish-profile: ${{ secrets.AZURE_FUNC_PUBLISH_PROFILE }}
          sku: flexconsumption
          package: func-publish
